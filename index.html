<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101014" />
  <title>AminoDarling — A Soul Searching</title>
  <meta name="description" content="The personal space of AminoDarling." />
  <style>
    :root {
      --glass: rgba(24, 24, 30, .58);
      --glass-border: rgba(255, 255, 255, .13);
      --text: #f7f4f8;
      --muted: #c7c2ca;
      --accent: #c8b7ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
      background: #101014;
    }
    .background {
      position: fixed; inset: 0; z-index: -3;
      background:
        linear-gradient(180deg, rgba(8,8,12,.42), rgba(8,8,12,.62)),
        url("background.jpg") center 42% / cover no-repeat,
        radial-gradient(ellipse at center, #34303a 0%, #111116 70%);
      transform: scale(1.03);
    }
    .background::after {
      content: ""; position: absolute; inset: 0;
      backdrop-filter: blur(3px);
      background: rgba(5, 5, 8, .16);
    }
    .shade {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,.58) 100%);
    }
    .snow {
      position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
    }
    .flake {
      position: absolute; top: -24px; color: rgba(255,255,255,.85);
      text-shadow: 0 0 8px rgba(255,255,255,.4);
      animation: snowfall linear infinite;
      user-select: none;
    }
    @keyframes snowfall {
      0% { transform: translate3d(0,-5vh,0) rotate(0); }
      100% { transform: translate3d(45px,110vh,0) rotate(220deg); }
    }
    main {
      min-height: 100vh; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 42px 18px;
    }
    .profile {
      width: min(100%, 520px);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: appear 1.2s ease both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar-wrap {
      width: 138px; height: 138px; margin: 0 auto 10px;
      position: relative; display: grid; place-items: center;
    }
    .avatar {
      width: 104px; height: 104px; object-fit: cover;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 0 30px rgba(183,161,255,.18);
      background: #29252f;
    }
    .name {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 7vw, 3rem);
      font-weight: 700;
      font-style: italic;
      letter-spacing: .02em;
      text-shadow: 0 2px 8px rgba(0,0,0,.8), 0 0 22px rgba(255,255,255,.14);
    }
    .tagline {
      margin: 10px 0 22px;
      font-size: clamp(.95rem, 3.4vw, 1.15rem);
      font-weight: 600;
      text-shadow: 0 2px 7px #000;
    }
    .music-card {
      width: min(100%, 420px);
      margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
      padding: 12px;
      text-align: left;
      border: 1px solid var(--glass-border);
      border-radius: 25px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 35px rgba(0,0,0,.22);
    }
    .music-avatar {
      width: 62px; height: 62px; flex: 0 0 62px;
      border-radius: 17px; object-fit: cover;
      background: #302b36;
    }
    .music-info { min-width: 0; flex: 1; }
    .music-top {
      display: flex; align-items: center; gap: 7px;
      font-size: 1rem; font-weight: 750;
      margin-bottom: 5px;
    }
    .pill {
      font-size: .65rem; font-weight: 700;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px; padding: 2px 7px;
      color: #e7e1ff;
    }
    .status {
      font-size: .83rem; font-weight: 650;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status small {
      display: block; color: var(--muted);
      font-weight: 400; margin-top: 3px;
    }
    .socials {
      display: flex; justify-content: center; align-items: center;
      gap: 11px; flex-wrap: wrap;
      margin: 30px 0 12px;
    }
    .social {
      width: 43px; height: 43px;
      display: grid; place-items: center;
      border-radius: 50%;
      color: white; text-decoration: none;
      transition: transform .2s ease, filter .2s ease;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,.28));
    }
    .social:hover { transform: translateY(-5px) scale(1.08); filter: brightness(1.12); }
    .social svg { width: 25px; height: 25px; fill: currentColor; }
    .instagram { background: #d62976; }
    .facebook { background: #1877f2; }
    .github { background: #f5f5f5; color: #171717; }
    .linkedin { background: #0a66c2; }
    .discord { background: #5865f2; }
    .x { background: #111; border: 1px solid rgba(255,255,255,.15); }
    .pinterest { background: #bd081c; }
    .footer {
      margin-top: 26px; color: rgba(255,255,255,.55);
      font-size: .75rem; letter-spacing: .04em;
    }
    @media (max-width: 480px) {
      main { padding: 28px 16px; }
      .avatar-wrap { width: 122px; height: 122px; }
      .avatar { width: 92px; height: 92px; }
      .music-card { gap: 9px; padding: 10px; border-radius: 21px; }
      .music-avatar { width: 52px; height: 52px; flex-basis: 52px; }
      .socials { gap: 9px; margin-top: 25px; }
      .social { width: 40px; height: 40px; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <main>
    <section class="profile" aria-label="AminoDarling profile">
      <div class="avatar-wrap">
        <img class="avatar" src="avatar.png" alt="AminoDarling avatar" />
      </div>

      <h1 class="name">AminoDarling</h1>
      <p class="tagline">-- a Soul ... Search For Where It Belongs --</p>

      <div class="music-card">
        <img class="music-avatar" src="avatar.png" alt="" />
        <div class="music-info">
          <div class="music-top">aminodarling <span class="pill">✦ AMINE</span></div>
          <div class="status">🎧 Creating my own little world
            <small>Some peace after a long day</small>
          </div>
        </div>
      </div>

      <nav class="socials" aria-label="Social links">
        <a class="social instagram" href="https://www.instagram.com/amin_o_darling/" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 3a4.8 4.8 0 1 1 0 9.6 4.8 4.8 0 0 1 0-9.6zm0 2.2a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2zm5.1-3.4a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></svg>
        </a>
        <a class="social facebook" href="https://www.facebook.com/amin.0.darling" aria-label="Facebook" title="Facebook">
          <svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.3-1.5 1.6-1.5h1.7V3.7c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.4v1.9H7.3V11h2.8v10h3.4z"/></svg>
        </a>

        </a>
        <a class="social linkedin" href="https://www.linkedin.com/in/YOUR_LINKEDIN_USERNAME/" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M5.2 3.2a2.1 2.1 0 1 1 0 4.2 2.1 2.1 0 0 1 0-4.2zM3.4 9h3.6v11H3.4zM9.2 9h3.4v1.5h.1A3.7 3.7 0 0 1 16 8.7c3.7 0 4.4 2.4 4.4 5.5V20h-3.6v-5.1c0-1.2 0-2.8-1.7-2.8s-2 1.3-2 2.7V20H9.2z"/></svg>

        <a class="social x" href="https://x.com/" aria-label="X" title="X">
          <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.2l7.3-8.4L2.8 2h6.5l4.4 5.9L18.9 2zm-1.1 18h1.7L8.2 3.9H6.4L17.8 20z"/></svg>
        </a>
        <a class="social discord" href="https://discord.com/" aria-label="Discord" title="Discord">
          <svg viewBox="0 0 24 24"><path d="M19.7 5.1A18 18 0 0 0 15.3 4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.1C1.5 9.2.7 13.2 1.1 17.2a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a13 13 0 0 0 11.4 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.7-.8-8.7-3.2-12.1zM8.7 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
        </a>
      </nav>

      <div class="footer">A little corner of the internet · AminoDarling</div>
    </section>
  </main>

  <script>
    // Gentle snowfall. Reduce count for slower devices if needed.
    const snow = document.getElementById("snow");
    for (let i = 0; i < 34; i++) {
      const flake = document.createElement("span");
      flake.className = "flake";
      flake.textContent = Math.random() > .55 ? "❄" : "✦";
      flake.style.left = Math.random() * 100 + "%";
      flake.style.opacity = (Math.random() * .65 + .25).toFixed(2);
      flake.style.fontSize = (Math.random() * 10 + 8) + "px";
      flake.style.animationDuration = (Math.random() * 12 + 10) + "s";
      flake.style.animationDelay = (-Math.random() * 22) + "s";
      snow.appendChild(flake);
    }
  </script>
</body>
</html>
